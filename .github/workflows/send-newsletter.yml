name: Send newsletter email

on:
  push:
    branches: [main]
    paths:
      - 'src/data/newsletters.ts'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # Runs before the Pages wait so a malformed entry fails in seconds rather
      # than 90 seconds later, and before anything is sent. Same parser the send
      # itself uses — see scripts/lib/latest-newsletter.mjs.
      - name: Validate newsletters.ts
        run: node scripts/check-newsletters.mjs

      - name: Wait for Cloudflare Pages deploy
        run: sleep 90

      - name: Extract latest newsletter and send
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          SITE_URL: https://ilovethewrap.com
        run: node scripts/send-latest.mjs
