name: Validate newsletters

# The send pipeline extracts the newest edition out of newsletters.ts. A
# malformed entry does not fail tsc or the Vite build — it fails by quietly
# emailing the wrong thing to the whole list. This runs on every PR and push
# that touches the data file or the parser, so it fails in review instead.

on:
  pull_request:
    paths:
      - 'src/data/newsletters.ts'
      - 'scripts/lib/latest-newsletter.mjs'
      - 'scripts/check-newsletters.mjs'
      - 'scripts/test-latest-newsletter.mjs'
      - '.github/workflows/validate-newsletters.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/newsletters.ts'
      - 'scripts/lib/latest-newsletter.mjs'
      - 'scripts/check-newsletters.mjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Parser regression tests
        run: node scripts/test-latest-newsletter.mjs

      - name: Validate the latest edition
        run: node scripts/check-newsletters.mjs
